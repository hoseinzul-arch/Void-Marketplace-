<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page Image Fix</title>
    <style>
        /* 1. THE CONTAINER: Controls the "frame" of the product image */
        .product-image-container {
            width: 100%;
            max-width: 500px; /* Adjust based on your layout */
            aspect-ratio: 1 / 1; /* Keeps the box a perfect square */
            margin: 20px auto;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #fff;
        }

        /* 2. THE IMAGE: Auto-readjusts to prevent zoom and pixelation */
        .product-image-container img {
            /* Fixes the "Zoomed In" issue: 
               'contain' ensures the whole image is visible inside the frame */
            width: 100%;
            height: 100%;
            object-fit: contain;

            /* Fixes Pixelation: 
               Prevents the image from stretching beyond its actual size */
            max-width: 100%;
            image-rendering: -webkit-optimize-contrast; /* Sharper scaling in Chrome/Safari */
            image-rendering: crisp-edges;
            
            /* Smooth transition when the window is resized */
            transition: transform 0.3s ease;
        }

        /* 3. OPTIONAL: Subtle hover effect (no distortion) */
        .product-image-container img:hover {
            transform: scale(1.02);
        }

        /* 4. PRODUCT PAGE WRAPPER: Basic layout for context */
        .product-page-layout {
            font-family: sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .product-page-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="product-page-layout">
        <!-- Image Section -->
        <div class="product-image-container">
            <!-- Replace the src with your actual product image URL -->
            <img src="https://via.placeholder.com/1000" alt="Product Image">
        </div>

        <!-- Details Section -->
        <div class="product-info">
            <h1>Premium Product Title</h1>
            <p class="price">$99.00</p>
            <p>The image on the left is now set to 'auto-readjust'. It will never crop or zoom into the product, and it maintains its resolution to avoid pixelation.</p>
            <button style="padding: 10px 20px; cursor: pointer;">Add to Cart</button>
        </div>
    </div>

</body>
</html>
